jenkins:
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  clouds:
  - kubernetes:
      containerCap: 10
      containerCapStr: "10"
      jenkinsTunnel: "jenkins-agent.cicd-tools.svc.cluster.local:50000"
      jenkinsUrl: "http://jenkins.cicd-tools.svc.cluster.local:8080"
      name: "kubernetes"
      namespace: "cicd-tools"
      podLabels:
      - key: "jenkins/jenkins-jenkins-agent"
        value: "true"
      serverUrl: "https://kubernetes.default"
      templates:
      - containers:
        - args: "^${computer.jnlpmac} ^${computer.name}"
          envVars:
          - envVar:
              key: "JENKINS_URL"
              value: "http://jenkins.cicd-tools.svc.cluster.local:8080/"
          image: "jenkins/inbound-agent:3345.v03dee9b_f88fc-6"
          livenessProbe:
            failureThreshold: 0
            initialDelaySeconds: 0
            periodSeconds: 0
            successThreshold: 0
            timeoutSeconds: 0
          name: "jnlp"
          resourceLimitCpu: "512m"
          resourceLimitMemory: "512Mi"
          resourceRequestCpu: "512m"
          resourceRequestMemory: "512Mi"
          workingDir: "/home/jenkins/agent"
        id: "edd628deb5ffddf0a41df176a86a0052495c9878711b9a1ae5fb0745fa7f18b4"
        label: "jenkins-jenkins-agent"
        name: "jenkins-agent"
        namespace: "cicd-tools"
        nodeUsageMode: NORMAL
        podRetention: "never"
        serviceAccount: "default"
        slaveConnectTimeout: 100
